name: Elite Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elite-scanner-manual
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner manually
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_DATA_FEED: sip
          TZ: America/New_York
        run: |
          python elite_scanner.py
          python macro_calendar.py
          python signal_engine.py
          python elite_dashboard.py

      - name: Upload generated files as artifact only
        uses: actions/upload-artifact@v4
        with:
          name: elite-scanner-manual-output
          path: |
            dashboard.html
            index.html
            *.csv
            *.json
            *.log
