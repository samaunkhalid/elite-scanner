name: Elite Scanner

on:
  schedule:
    # Full scanner schedule.
    # Timezone-aware New York schedule. GitHub handles EDT/EST automatically.

    # Pre-market: 8:30, 8:45 ET
    - cron: "30,45 8 * * 1-5"
      timezone: "America/New_York"

    # Pre-market: 9:00, 9:15, 9:25 ET
    # Morning discovery: 9:35, 9:45, 9:55 ET
    - cron: "0,15,25,35,45,55 9 * * 1-5"
      timezone: "America/New_York"

    # Morning discovery: 10:05, 10:15, 10:30 ET
    - cron: "5,15,30 10 * * 1-5"
      timezone: "America/New_York"

    # Late morning: 11:00 ET
    - cron: "0 11 * * 1-5"
      timezone: "America/New_York"

    # Lunch checkpoint: 12:30 ET
    - cron: "30 12 * * 1-5"
      timezone: "America/New_York"

    # Afternoon restart: 1:30 ET
    - cron: "30 13 * * 1-5"
      timezone: "America/New_York"

    # Afternoon: 2:00, 2:30 ET
    - cron: "0,30 14 * * 1-5"
      timezone: "America/New_York"

    # Afternoon: 3:00 ET
    - cron: "0 15 * * 1-5"
      timezone: "America/New_York"

  workflow_dispatch:

concurrency:
  group: elite-scanner-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show scanner time
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "NY time:  $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Elite Scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python elite_scanner.py

      - name: Build Macro Calendar
        run: python macro_calendar.py

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Make dashboard the GitHub Pages homepage
        run: |
          cp dashboard.html index.html

      - name: Commit scanner results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add index.html || true
          git add dashboard.html || true

          git add elite_watchlist.csv || true
          git add elite_watchlist_raw.csv || true
          git add elite_watchlist.json || true

          git add potential_movers.csv || true
          git add active_momentum.csv || true
          git add extended_movers.csv || true
          git add high_risk_movers.csv || true

          git add market_regime.json || true
          git add macro_calendar.json || true

          git add signal_desk.json || true
          git add signal_state.json || true
          git add suppressed_signals.csv || true

          if git diff --staged --quiet; then
            echo "No scanner/dashboard changes to commit"
          else
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
