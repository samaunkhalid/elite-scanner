name: Elite Scanner

on:
  schedule:
    # Runs at 9:00 AM ET (13:00 UTC) Mon-Fri = 8:00 PM Bangkok
    # 30 min before market open
    - cron: '0 13 * * 1-5'
    # Also run mid-morning at 10:30 AM ET (14:30 UTC) = 9:30 PM Bangkok
    - cron: '30 14 * * 1-5'
    # Afternoon update at 1:00 PM ET (17:00 UTC) = 12:00 AM Bangkok
    - cron: '0 17 * * 1-5'
  workflow_dispatch:  # Manual trigger button in Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Elite Scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python elite_scanner.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add elite_watchlist.csv elite_wagit add elite_watchlist.csv elite_watchlist_raw.csv elite_watchlist.json market_regime.json dashboard.html || truetchlist.json dashboard.html || true
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
