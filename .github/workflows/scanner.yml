name: Elite Scanner

on:
  schedule:
    # Runs at 9:00 AM ET during EDT / market season
    - cron: '0 13 * * 1-5'

    # Runs at 10:30 AM ET during EDT
    - cron: '30 14 * * 1-5'

    # Runs at 1:00 PM ET during EDT
    - cron: '0 17 * * 1-5'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Elite Scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python elite_scanner.py

      - name: Build Macro Calendar
        run: python macro_calendar.py

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add elite_watchlist.csv || true
          git add elite_watchlist_raw.csv || true
          git add elite_watchlist.json || true
          git add market_regime.json || true
          git add macro_calendar.json || true
          git add dashboard.html || true
          git add potential_movers.csv || true
          git add active_momentum.csv || true
          git add extended_movers.csv || true
          git add high_risk_movers.csv || true
          git add signal_desk.json || true
          git add signal_state.json || true
          git add suppressed_signals.csv || true

          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
