name: Signal Desk Refresh

on:
  schedule:
    # Signal Desk Refresh — every 5 minutes during regular market hours.
    # Timezone-aware New York schedule. GitHub handles EDT/EST automatically.

    # 9:30 AM–9:55 AM ET
    - cron: "30,35,40,45,50,55 9 * * 1-5"
      timezone: "America/New_York"

    # 10:00 AM–3:55 PM ET
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 10,11,12,13,14,15 * * 1-5"
      timezone: "America/New_York"

  workflow_dispatch:

concurrency:
  group: signal-desk-refresh
  cancel-in-progress: true

jobs:
  refresh-signals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show refresh time
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "NY time:  $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Make dashboard the GitHub Pages homepage
        run: |
          cp dashboard.html index.html

      - name: Commit signal refresh results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add index.html || true
          git add dashboard.html || true
          git add signal_desk.json || true
          git add signal_state.json || true
          git add suppressed_signals.csv || true

          if git diff --staged --quiet; then
            echo "No signal/dashboard changes to commit"
          else
            git commit -m "signal refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
