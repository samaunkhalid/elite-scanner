name: Signal Desk Refresh

on:
  schedule:
    # NY market time during EDT:
    # Refresh every 5 minutes from 09:00-15:59 ET.
    # signal_engine.py controls valid/blackout windows internally.
    - cron: '*/5 13-19 * * 1-5'

    # One close-time refresh at 16:00 ET to expire/mark stale protected signals.
    - cron: '0 20 * * 1-5'

  workflow_dispatch:

concurrency:
  group: elite-scanner-write
  cancel-in-progress: false

jobs:
  refresh-signals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show refresh time
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "NY time:  $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Make dashboard the GitHub Pages homepage
        run: |
          cp dashboard.html index.html

      - name: Commit signal refresh results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html dashboard.html || true
          git add signal_desk.json signal_state.json || true

          if [ -f suppressed_signals.csv ]; then
            git add suppressed_signals.csv
          fi

          if git diff --staged --quiet; then
            echo "No signal/dashboard changes to commit"
            exit 0
          fi

          git commit -m "signal refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "Push successful"
              exit 0
            fi
            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
