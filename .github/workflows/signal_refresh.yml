name: Signal Desk Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elite-signal-manual
  cancel-in-progress: false

jobs:
  signal-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Desk manually
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_DATA_FEED: sip
          TZ: America/New_York
        run: |
          python signal_engine.py
          python elite_dashboard.py

      - name: Upload generated files as artifact only
        uses: actions/upload-artifact@v4
        with:
          name: signal-desk-manual-output
          path: |
            signal_desk.json
            signal_state.json
            signal_decisions.log
            dashboard.html
