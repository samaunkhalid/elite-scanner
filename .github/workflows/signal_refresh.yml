name: Signal Desk Refresh

on:
  schedule:
    # TEMP TEST ONLY.
    # Simple proven UTC schedule.
    # During EDT:
    # 20:00 UTC = 4:00 PM ET
    # 20:05 UTC = 4:05 PM ET
    # 20:10 UTC = 4:10 PM ET
    # 20:15 UTC = 4:15 PM ET
    # 20:20 UTC = 4:20 PM ET
    # 20:25 UTC = 4:25 PM ET
    # 20:30 UTC = 4:30 PM ET
    # 20:35 UTC = 4:35 PM ET
    # 20:40 UTC = 4:40 PM ET
    # 20:45 UTC = 4:45 PM ET
    # 20:50 UTC = 4:50 PM ET
    # 20:55 UTC = 4:55 PM ET
    # 21:00 UTC = 5:00 PM ET

    - cron: '0 20 * * 1-5'
    - cron: '5 20 * * 1-5'
    - cron: '10 20 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '20 20 * * 1-5'
    - cron: '25 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '35 20 * * 1-5'
    - cron: '40 20 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '50 20 * * 1-5'
    - cron: '55 20 * * 1-5'
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

concurrency:
  group: signal-desk-refresh
  cancel-in-progress: true

jobs:
  refresh-signals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show refresh time
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "NY time:  $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Make dashboard the GitHub Pages homepage
        run: |
          cp dashboard.html index.html

      - name: Commit signal refresh results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add index.html || true
          git add dashboard.html || true
          git add signal_desk.json || true
          git add signal_state.json || true
          git add suppressed_signals.csv || true

          if git diff --staged --quiet; then
            echo "No signal/dashboard changes to commit"
          else
            git commit -m "signal refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
