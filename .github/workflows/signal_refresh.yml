name: Signal Desk Refresh

on:
  schedule:
    # Offset 5-minute refresh schedule in NY market time during EDT.
    # This avoids the busiest exact */5 GitHub cron boundary.
    #
    # Important:
    # Signal Desk still refreshes during blackout windows because protected
    # TRIGGER_READY / ACTIVE_SIGNAL names must be monitored, invalidated,
    # expired, or suppressed. signal_engine.py controls whether new signals
    # are allowed.
    #
    # 09:33 through 09:58 ET
    - cron: '33,38,43,48,53,58 13 * * 1-5'
    # 10:03 through 10:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 14 * * 1-5'
    # 11:03 through 11:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 15 * * 1-5'
    # 12:03 through 12:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 16 * * 1-5'
    # 13:03 through 13:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 17 * * 1-5'
    # 14:03 through 14:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 18 * * 1-5'
    # 15:03 through 15:58 ET
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 19 * * 1-5'

    # One close cleanup refresh at 16:03 ET to expire protected signals.
    - cron: '3 20 * * 1-5'

  workflow_dispatch:

concurrency:
  group: elite-scanner-write
  cancel-in-progress: false

jobs:
  refresh-signals:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show refresh time
        run: |
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "NY time:  $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S ET')"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          SIGNAL_DEBUG: "1"
        run: python signal_engine.py

      - name: Build Dashboard
        run: python elite_dashboard.py

      - name: Make dashboard the GitHub Pages homepage
        run: |
          cp dashboard.html index.html

      - name: Commit signal refresh results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html dashboard.html || true
          git add signal_desk.json signal_state.json signal_decisions.log || true

          if [ -f suppressed_signals.csv ]; then
            git add suppressed_signals.csv
          fi

          if git diff --staged --quiet; then
            echo "No signal/dashboard changes to commit"
            exit 0
          fi

          git commit -m "signal refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "Push successful"
              exit 0
            fi
            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
